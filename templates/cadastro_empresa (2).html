{% extends 'base.html' %}

{% block conteudo %}
<div class="container-fluid py-3">

    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-2">
        <div>
            <h2 class="mb-1 fw-bold text-dark">
                <i class="fa-solid fa-building-circle-plus me-2 text-info"></i>
                Nova Empresa
            </h2>
            <p class="text-muted mb-0">Cadastre uma nova empresa/cliente para usar o sistema.</p>
        </div>

        <a href="{{ url_for('visualizar_empresas') }}" class="btn btn-outline-secondary">
            <i class="fa-solid fa-arrow-left me-1"></i>
            Voltar
        </a>
    </div>

    <form method="POST" class="card border-0 shadow-sm">
        <div class="card-body">

            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Razão Social *</label>
                    <input type="text" name="razao_social" class="form-control" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-semibold">Nome Fantasia</label>
                    <input type="text" name="nome_fantasia" class="form-control">
                </div>

                <div class="col-md-4">
                    <label class="form-label fw-semibold">CNPJ</label>
                    <input type="text" name="cnpj" class="form-control" placeholder="Somente números ou formatado">
                </div>

                <div class="col-md-4">
                    <label class="form-label fw-semibold">Slug</label>
                    <input type="text" name="slug" class="form-control" placeholder="Ex.: tradicao-moveis">
                    <small class="text-muted">Se deixar vazio, o sistema gera automaticamente.</small>
                </div>

                <div class="col-md-2">
                    <label class="form-label fw-semibold">Status *</label>
                    <select name="status_empresa" class="form-select" required>
                        <option value="Ativa" selected>Ativa</option>
                        <option value="Inativa">Inativa</option>
                    </select>
                </div>

                <div class="col-md-2">
                    <label class="form-label fw-semibold">Plano *</label>
                    <select name="plano" class="form-select" required>
                        <option value="Profissional" selected>Profissional</option>
                        <option value="Starter">Starter</option>
                        <option value="Enterprise">Enterprise</option>
                    </select>
                </div>

                <div class="col-md-3">
                    <label class="form-label fw-semibold">Limite de usuários</label>
                    <input type="number" name="limite_usuarios" class="form-control" min="1" placeholder="Ex.: 5">
                </div>

                <div class="col-md-9">
                    <label class="form-label fw-semibold">Observação</label>
                    <textarea name="observacao" class="form-control" rows="3"></textarea>
                </div>
            </div>

        </div>

        <div class="card-footer bg-white d-flex justify-content-end gap-2">
            <a href="{{ url_for('visualizar_empresas') }}" class="btn btn-outline-secondary">
                Cancelar
            </a>

            <button type="submit" class="btn btn-info text-white fw-bold">
                <i class="fa-solid fa-floppy-disk me-1"></i>
                Salvar Empresa
            </button>
        </div>
    </form>

</div>
{% endblock %}
