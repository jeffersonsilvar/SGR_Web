{% extends 'base.html' %}

{% block conteudo %}
<div class="container-fluid text-dark">
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-1 pb-2 mb-3 border-bottom">
        <div>
            <h1 class="h3 font-monospace fw-bold mb-0">Editar Rota #{{ rota.id }}</h1>
            <small class="text-muted">Ajuste de motorista, valores e status operacional</small>
        </div>
        <a href="{{ url_for('visualizar_rotas') }}" class="btn btn-outline-secondary">
            <i class="fa-solid fa-arrow-left me-1"></i> Voltar
        </a>
    </div>

    <div class="card shadow-sm border-0 bg-white p-4 mb-5">
        <form action="{{ url_for('editar_rota', id=rota.id) }}" method="POST" class="needs-validation" novalidate>
            <h5 class="text-secondary font-monospace border-bottom pb-2 mb-4">
                <i class="fa-solid fa-truck-ramp-box me-2 text-info"></i>Dados da Rota / Carregamento
            </h5>

            <div class="row g-3">
                <div class="col-md-3">
                    <label for="data_lancamento" class="form-label fw-bold small text-muted">Data da Rota *</label>
                    <input type="date" class="form-control text-dark" id="data_lancamento" name="data_lancamento" value="{{ rota.data_lancamento }}" required>
                </div>

                <div class="col-md-5">
                    <label for="identi_rota" class="form-label fw-bold small text-muted">Identificação / Manifesto *</label>
                    <input type="text" class="form-control text-dark" id="identi_rota" name="identi_rota" value="{{ rota.identi_rota }}" required>
                </div>

                <div class="col-md-4">
                    <label for="tipo_rota" class="form-label fw-bold small text-muted">Tipo de Operação *</label>
                    <select class="form-select text-dark" id="tipo_rota" name="tipo_rota" required>
                        <option value="">-- Selecione o Tipo --</option>
                        <option value="Rota de 4h" {% if rota.tipo_rota == 'Rota de 4h' or rota.tipo_rota == 'Rota 4h' %}selected{% endif %}>Rota 4h</option>
                        <option value="Rota de 6h" {% if rota.tipo_rota == 'Rota de 6h' or rota.tipo_rota == 'Rota 6h' %}selected{% endif %}>Rota 6h</option>
                        <option value="Rota de 8h" {% if rota.tipo_rota == 'Rota de 8h' or rota.tipo_rota == 'Rota 8h' %}selected{% endif %}>Rota 8h</option>
                    </select>
                </div>

                <div class="col-md-12">
                    <label for="motorista_id" class="form-label fw-bold small text-muted">Motorista Responsável *</label>
                    <select class="form-select text-dark" id="motorista_id" name="motorista_id" required>
                        <option value="">-- Selecione o Motorista --</option>
                        {% for motorista in motoristas %}
                            <option value="{{ motorista.id }}" {% if motorista.id == rota.motorista_id %}selected{% endif %}>{{ motorista.nome_completo }}</option>
                        {% endfor %}
                    </select>
                </div>

                <h5 class="text-secondary font-monospace border-bottom pb-2 mt-4 mb-3 col-12">
                    <i class="fa-solid fa-money-bill-wave me-2 text-info"></i> Valores da Rota
                </h5>

                <div class="col-md-4">
                    <label for="valor_rota" class="form-label fw-bold small text-muted">Valor Base Rota</label>
                    <input type="number" step="0.01" min="0" class="form-control text-dark" id="valor_rota" name="valor_rota" value="{{ rota.valor_rota or 0 }}">
                </div>

                <div class="col-md-4">
                    <label for="valor_km" class="form-label fw-bold small text-muted">Valor de KM Adicional</label>
                    <input type="number" step="0.01" min="0" class="form-control text-dark" id="valor_km" name="valor_km" value="{{ rota.valor_km or 0 }}">
                </div>

                <div class="col-md-4">
                    <label for="outras_despesas" class="form-label fw-bold small text-muted">Outras Despesas</label>
                    <input type="number" step="0.01" min="0" class="form-control text-dark" id="outras_despesas" name="outras_despesas" value="{{ rota.outras_despesas or 0 }}">
                </div>

                <h5 class="text-secondary font-monospace border-bottom pb-2 mt-4 mb-3 col-12">
                    <i class="fa-solid fa-circle-info me-2 text-info"></i> Situações
                </h5>

                <div class="col-md-6">
                    <label for="situacao_rota" class="form-label fw-bold small text-muted">Situação da Rota</label>
                    <select class="form-select text-dark" id="situacao_rota" name="situacao_rota" required>
                        <option value="Pendente" {% if rota.situacao_rota == 'Pendente' %}selected{% endif %}>Pendente</option>
                        <option value="Faturada" {% if rota.situacao_rota == 'Faturada' %}selected{% endif %}>Faturada</option>
                        <option value="Quitada" {% if rota.situacao_rota == 'Quitada' %}selected{% endif %}>Quitada</option>
                        <option value="Cancelada" {% if rota.situacao_rota == 'Cancelada' %}selected{% endif %}>Cancelada</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label for="status_motorista" class="form-label fw-bold small text-muted">Status Motorista</label>
                    <select class="form-select text-dark" id="status_motorista" name="status_motorista" required>
                        <option value="Aguardando conferência" {% if rota.status_motorista == 'Aguardando conferência' %}selected{% endif %}>Aguardando conferência</option>
                        <option value="Conferida pelo motorista" {% if rota.status_motorista == 'Conferida pelo motorista' %}selected{% endif %}>Conferida pelo motorista</option>
                        <option value="Divergência apontada" {% if rota.status_motorista == 'Divergência apontada' %}selected{% endif %}>Divergência apontada</option>
                        <option value="Aguardando liberação" {% if rota.status_motorista == 'Aguardando liberação' %}selected{% endif %}>Aguardando liberação</option>
                        <option value="Liberada para NF" {% if rota.status_motorista == 'Liberada para NF' %}selected{% endif %}>Liberada para NF</option>
                        <option value="NF enviada" {% if rota.status_motorista == 'NF enviada' %}selected{% endif %}>NF enviada</option>
                        <option value="Em análise" {% if rota.status_motorista == 'Em análise' %}selected{% endif %}>Em análise</option>
                        <option value="Aprovada para pagamento" {% if rota.status_motorista == 'Aprovada para pagamento' %}selected{% endif %}>Aprovada para pagamento</option>
                        <option value="Pagamento confirmado" {% if rota.status_motorista == 'Pagamento confirmado' %}selected{% endif %}>Pagamento confirmado</option>
                        <option value="Bloqueada" {% if rota.status_motorista == 'Bloqueada' %}selected{% endif %}>Bloqueada</option>
                        <option value="Cancelada" {% if rota.status_motorista == 'Cancelada' %}selected{% endif %}>Cancelada</option>
                    </select>
                    <small class="text-muted">Use “Liberada para NF” quando o motorista puder enviar o XML.</small>
                </div>
            </div>

            <div class="mt-4 border-top pt-3 d-flex gap-2 justify-content-end">
                <a href="{{ url_for('visualizar_rotas') }}" class="btn btn-secondary fw-bold px-4">Voltar</a>
                <button type="submit" class="btn btn-primary fw-bold px-4">
                    <i class="fa-solid fa-floppy-disk me-2"></i> Atualizar Rota
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
