{% extends 'base.html' %}
{% block conteudo %}
<div class="container-fluid py-3">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h3 class="mb-1 fw-bold">Novo Título Financeiro</h3>
            <div class="text-muted small">Lançamento manual de conta a pagar ou conta a receber.</div>
        </div>
        <a href="{{ url_for('financeiro.financeiro_titulos') }}" class="btn btn-outline-secondary">Voltar</a>
    </div>

    <form method="post" class="card border-0 shadow-sm">
        <div class="card-body">
            <div class="row g-3">
                {% if is_super_admin %}
                <div class="col-md-4">
                    <label class="form-label">Empresa *</label>
                    <select name="empresa_id" class="form-select" required>
                        <option value="">Selecione</option>
                        {% for empresa in empresas %}
                            <option value="{{ empresa.id }}">{{ empresa.nome_fantasia or empresa.razao_social }}</option>
                        {% endfor %}
                    </select>
                </div>
                {% endif %}

                <div class="col-md-3">
                    <label class="form-label">Tipo *</label>
                    <select name="tipo_titulo" class="form-select" required>
                        <option value="PAGAR">Conta a pagar</option>
                        <option value="RECEBER">Conta a receber</option>
                    </select>
                </div>

                <div class="col-md-5">
                    <label class="form-label">Pessoa responsável *</label>
                    <input type="hidden" name="pessoa_id" id="pessoa_id" required>
                    <div class="position-relative sgr-busca-pessoa" data-uso="financeiro" data-hidden="pessoa_id">
                        <input type="text" class="form-control sgr-busca-input" placeholder="Digite nome, CPF/CNPJ ou ID..." autocomplete="off" required>
                        <div class="list-group position-absolute w-100 shadow-sm sgr-busca-resultados d-none" style="z-index: 1050; max-height: 260px; overflow:auto;"></div>
                    </div>
                    <small class="text-muted">Busca inteligente por nome, documento ou ID interno do cadastro.</small>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Número do documento *</label>
                    <input type="text" name="numero_documento" class="form-control" required placeholder="NF, recibo, contrato...">
                </div>
                <div class="col-md-8">
                    <label class="form-label">Descrição *</label>
                    <input type="text" name="descricao" class="form-control" required placeholder="Ex.: Prestação de serviço de entrega">
                </div>
                <div class="col-md-12">
                    <label class="form-label">Histórico</label>
                    <textarea name="historico" class="form-control" rows="2" placeholder="Histórico financeiro detalhado. Se ficar vazio, o sistema monta automaticamente."></textarea>
                </div>

                <div class="col-md-3">
                    <label class="form-label">Valor original *</label>
                    <input type="text" name="valor_original" class="form-control" required placeholder="0,00">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Desconto</label>
                    <input type="text" name="valor_desconto" class="form-control" value="0,00">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Acréscimo</label>
                    <input type="text" name="valor_acrescimo" class="form-control" value="0,00">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Forma de pagamento</label>
                    <select name="forma_pagamento" class="form-select">
                        <option value="">A definir</option>
                        {% for forma in formas_pagamento %}
                            <option value="{{ forma }}">{{ forma }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-md-3">
                    <label class="form-label">Emissão *</label>
                    <input type="date" name="data_emissao" class="form-control" value="{{ hoje }}" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Competência</label>
                    <input type="date" name="data_competencia" class="form-control" value="{{ hoje }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Vencimento *</label>
                    <input type="date" name="data_vencimento" class="form-control" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Conta caixa prevista</label>
                    <select name="conta_caixa_prevista_id" class="form-select">
                        <option value="">A definir na baixa</option>
                        {% for conta in contas_caixa %}
                            <option value="{{ conta.id }}">{{ conta.nome_conta }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-md-12">
                    <label class="form-label">Observação</label>
                    <textarea name="observacao" class="form-control" rows="2"></textarea>
                </div>
            </div>
        </div>
        <div class="card-footer bg-white d-flex justify-content-end gap-2">
            <a href="{{ url_for('financeiro.financeiro_titulos') }}" class="btn btn-outline-secondary">Cancelar</a>
            <button class="btn btn-primary"><i class="fa-solid fa-floppy-disk me-1"></i> Salvar título</button>
        </div>
    </form>
</div>

<script>
(function(){
    function inicializarBuscaPessoa(wrapper){
        const input = wrapper.querySelector('.sgr-busca-input');
        const resultados = wrapper.querySelector('.sgr-busca-resultados');
        const hidden = document.getElementById(wrapper.dataset.hidden);
        const uso = wrapper.dataset.uso || 'todos';
        let timer = null;

        function limparSelecao(){
            if(hidden) hidden.value = '';
        }

        input.addEventListener('input', function(){
            limparSelecao();
            const q = input.value.trim();
            clearTimeout(timer);
            if(q.length < 1){
                resultados.classList.add('d-none');
                resultados.innerHTML = '';
                return;
            }
            timer = setTimeout(function(){
                fetch(`{{ url_for('api_buscar_pessoas') }}?uso=${encodeURIComponent(uso)}&q=${encodeURIComponent(q)}`)
                    .then(resp => resp.json())
                    .then(data => {
                        resultados.innerHTML = '';
                        const lista = data.results || [];
                        if(!lista.length){
                            resultados.innerHTML = '<div class="list-group-item text-muted small">Nenhum cadastro encontrado.</div>';
                            resultados.classList.remove('d-none');
                            return;
                        }
                        lista.forEach(item => {
                            const btn = document.createElement('button');
                            btn.type = 'button';
                            btn.className = 'list-group-item list-group-item-action';
                            btn.innerHTML = `<strong>${item.nome || ''}</strong><br><small class="text-muted">#${item.id} — ${item.cpf_cnpj || 'sem documento'} — ${item.tipo_cadastro || ''}${item.tipo_prestador ? ' / ' + item.tipo_prestador : ''}</small>`;
                            btn.addEventListener('click', function(){
                                hidden.value = item.id;
                                input.value = item.text;
                                resultados.classList.add('d-none');
                            });
                            resultados.appendChild(btn);
                        });
                        resultados.classList.remove('d-none');
                    })
                    .catch(() => {
                        resultados.innerHTML = '<div class="list-group-item text-danger small">Erro ao buscar cadastro.</div>';
                        resultados.classList.remove('d-none');
                    });
            }, 250);
        });

        document.addEventListener('click', function(e){
            if(!wrapper.contains(e.target)){
                resultados.classList.add('d-none');
            }
        });
    }

    document.querySelectorAll('.sgr-busca-pessoa').forEach(inicializarBuscaPessoa);
})();
</script>
{% endblock %}
