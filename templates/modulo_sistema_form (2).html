{% extends 'base.html' %}
{% block conteudo %}
<div class="d-flex justify-content-between align-items-start mb-3">
  <div>
    <div class="text-muted small"><i class="fa-solid fa-house me-1"></i> Sistema / Menus e Módulos / Módulo</div>
    <h1 class="fw-bold">{% if modulo %}Editar módulo{% else %}Novo módulo{% endif %}</h1>
    <p class="text-muted">Somente Super Admin/Suporte pode alterar módulos globais.</p>
  </div>
  <a href="{{ url_for('gerenciar_menus_modulos') }}" class="btn btn-outline-secondary"><i class="fa-solid fa-arrow-left me-1"></i> Voltar</a>
</div>
<div class="card shadow-sm border-0"><div class="card-body p-4">
<form method="post">
  <div class="row g-3">
    <div class="col-md-6"><label class="form-label fw-bold">Nome</label><input name="nome" class="form-control" value="{{ modulo.nome if modulo else '' }}" required></div>
    <div class="col-md-6"><label class="form-label fw-bold">Código</label><input name="codigo" class="form-control" value="{{ modulo.codigo if modulo else '' }}" placeholder="ex: financeiro"></div>
    <div class="col-md-8"><label class="form-label fw-bold">Descrição</label><input name="descricao" class="form-control" value="{{ modulo.descricao if modulo else '' }}"></div>
    <div class="col-md-4"><label class="form-label fw-bold">Ícone FontAwesome</label><input name="icone" class="form-control" value="{{ modulo.icone if modulo else 'fa-solid fa-folder' }}"></div>
    <div class="col-md-3"><label class="form-label fw-bold">Ordem</label><input type="number" name="ordem" class="form-control" value="{{ modulo.ordem if modulo else 0 }}"></div>
    <div class="col-md-3"><label class="form-label fw-bold">Status</label><select name="ativo" class="form-select"><option value="1" {% if not modulo or modulo.ativo %}selected{% endif %}>Ativo</option><option value="0" {% if modulo and not modulo.ativo %}selected{% endif %}>Inativo</option></select></div>
    <div class="col-md-3"><label class="form-label fw-bold">Visível no menu</label><select name="visivel_menu" class="form-select"><option value="1" {% if not modulo or modulo.visivel_menu %}selected{% endif %}>Sim</option><option value="0" {% if modulo and not modulo.visivel_menu %}selected{% endif %}>Não</option></select></div>
    <div class="col-md-3"><label class="form-label fw-bold">Restrição</label><select name="somente_super_admin" class="form-select"><option value="0" {% if not modulo or not modulo.somente_super_admin %}selected{% endif %}>Padrão</option><option value="1" {% if modulo and modulo.somente_super_admin %}selected{% endif %}>Somente Super Admin/Suporte</option></select></div>
    <input type="hidden" name="somente_suporte" value="0">
  </div>
  <div class="mt-4 d-flex justify-content-end gap-2"><a href="{{ url_for('gerenciar_menus_modulos') }}" class="btn btn-outline-secondary">Cancelar</a><button class="btn btn-primary"><i class="fa-solid fa-floppy-disk me-1"></i> Salvar</button></div>
</form>
</div></div>
{% endblock %}
